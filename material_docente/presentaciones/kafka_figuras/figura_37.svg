<svg xmlns="http://www.w3.org/2000/svg" width="880" height="930" viewBox="0 0 880 930"><rect width="880" height="930" fill="#fff"/><text x="440" y="55" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#0f172a">Verificación del entorno Kafka</text><rect x="115" y="100" width="650" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="440" y="144" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#1e40af">1. Revisar Docker Compose</text><text x="440" y="178" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Identificar Kafka y ZooKeeper</text><path d="M440 205 V255 M426 241 L440 255 L454 241" fill="none" stroke="#64748b" stroke-width="4"/><rect x="115" y="260" width="650" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="440" y="304" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#1e40af">2. Verificar contenedores</text><text x="440" y="338" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">docker ps / docker ps -a</text><path d="M440 365 V415 M426 401 L440 415 L454 401" fill="none" stroke="#64748b" stroke-width="4"/><rect x="115" y="420" width="650" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="440" y="464" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#1e40af">3. Revisar registros</text><text x="440" y="498" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">docker logs kafka</text><path d="M440 525 V575 M426 561 L440 575 L454 561" fill="none" stroke="#64748b" stroke-width="4"/><rect x="115" y="580" width="650" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="440" y="624" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#1e40af">4. Comprobar el broker</text><text x="440" y="658" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Consulta administrativa compatible</text><path d="M440 685 V735 M426 721 L440 735 L454 721" fill="none" stroke="#64748b" stroke-width="4"/><rect x="115" y="740" width="650" height="105" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="440" y="784" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#1e40af">5. Verificar acceso web</text><text x="440" y="818" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Interfaz del entorno en puerto 3030</text></svg>